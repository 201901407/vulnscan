[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnscan"
version = "0.1.0"
description = "Teacher-to-student vulnerability scanning loop for decompiled apps"
requires-python = ">=3.11"
dependencies = [
    "litellm==1.104.0",
    "pydantic>=2,<3",
    "PyYAML>=6",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vulnscan = "vulnscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vulnscan.prompts" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
